services:
  # catalog veritabanı
  catalog.db:
    image: postgres:latest
    container_name: catalog.db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=CatalogDb
    ports:
      - "5431:5432"
    volumes:
      - catalog_data:/var/lib/postgresql/data

  # identity veritabanı
  identity.db:
    image: postgres:latest
    container_name: identity.db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=IdentityDb
    ports:
      - "5432:5432"
    volumes:
      - identity_data:/var/lib/postgresql/data

  # Basket Veritabanı
  basket.db:
    image: postgres:latest
    container_name: basket.db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=BasketDb
    ports:
      - "5433:5432"
    volumes:
      - basket_data:/var/lib/postgresql/data

  # Discount Veritabanı
  discount.db:
    image: postgres:latest
    container_name: discount.db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=DiscountDb
    ports:
      - "5434:5432"
    volumes:
      - discount_data:/var/lib/postgresql/data

  # Order Veritabanı
  order.db:
    image: postgres:latest
    container_name: order.db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=OrderDb
    ports:
      - "5435:5432"
    volumes:
      - order_data:/var/lib/postgresql/data

  # Payment Veritabanı
  payment.db:
    image: postgres:latest
    container_name: payment.db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=PaymentDb
    ports:
      - "5436:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data

  # Inventory Veritabanı
  inventory.db:
    image: postgres:latest
    container_name: inventory.db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=InventoryDb
    ports:
      - "5437:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data

volumes:
  catalog_data:
  identity_data:
  basket_data:
  discount_data:
  order_data:
  payment_data:
  inventory_data:

networks:
  default:
    name: ecommerce-network